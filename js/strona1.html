<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierwsza strona z JS</title>
    <script src="strona1.js"></script>
</head>
<body>
<H1 id="tytul">To jest mój tytuł</H1>
<button onclick="zmien_tytul()">Zmień</button>

<br>
<form>
    <label for="imie">Imie:</label>
    <input type="text" id="imie">
    <label for="naz">Nazwisko:</label>
    <input type="text" id="naz">
    <button type="button" onclick="pokaz_dane()">Wyświetl</button>

</form>
    <button type="button" onclick="zmien()">zmien kolory</button>

<H1 id="dane"></H1>

<script>
    function pokaz_dane(){
        let imie_dane = document.getElementById("imie").value;
        let nazwisko_dane = document.getElementById("naz").value;
        document.getElementById("dane").innerHTML = "Witaj " + imie_dane + " " + nazwisko_dane; 
    }


   function zmien(){
    let tytul = document.getElementById("tytul");

    tytul.style.color = "#A534CC";
    tytul.style.backgroundColor = "lightgrey";
    tytul.style.fontSize = "50px";
    tytul.style.textAlign="center";
   }
</script>

</body>
</html>
