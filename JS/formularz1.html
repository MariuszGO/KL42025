<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Automatyczne sumowanie</title>
</head>

<body>

<label>Liczba 1:</label>
<input type="number" id="liczba1">

<br><br>

<label>Liczba 2:</label>
<input type="number" id="liczba2">

<p>Suma: <span id="wynik">0</span></p>

<script>
    const liczba1 = document.getElementById("liczba1");
    const liczba2 = document.getElementById("liczba2");
    const wynik = document.getElementById("wynik");

    function obliczSume() {
        let a = Number(liczba1.value);
        let b = Number(liczba2.value);

        wynik.textContent = a + b;
    }

    liczba1.addEventListener("input", obliczSume);
    liczba2.addEventListener("input", obliczSume);
</script>

</body>
</html>
